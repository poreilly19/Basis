[package]
name = "basis-desktop"
version = "0.7.30"
description = "Basis Studio desktop workspace"
authors = ["PJ OReilly"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
base64 = "=0.23.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["sync", "macros"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
