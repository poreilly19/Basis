name: Basis checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basis-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check the committed standalone build
        run: npm run check
      - name: Verify build output and repeated builds are byte-identical
        run: >-
          node -e "const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict');
          const file='app/index.html',before=fs.readFileSync(file);
          cp.execFileSync(process.execPath,['scripts/sync-native.cjs'],{stdio:'inherit'});
          const first=fs.readFileSync(file);assert.ok(before.equals(first),'Committed build is stale');
          cp.execFileSync(process.execPath,['scripts/sync-native.cjs'],{stdio:'inherit'});
          assert.ok(first.equals(fs.readFileSync(file)),'Repeated build changed its output');"
      - name: Node regression suites
        run: npm test
      - name: Local app launcher regressions (including native CMD on Windows)
        run: npm run test:launcher
      - name: Cross-platform runtime runner regressions
        run: npm run test:runner

  browser:
    name: Chromium and actual runtime integrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned development-only browser harness
        run: python -m pip install playwright==1.62.0
      - name: Install Chromium and its system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Restore separately cached public runtime fixtures
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/basis-runtime-dependencies
          key: basis-runtime-${{ runner.os }}-${{ hashFiles('tests/fixtures/runtime_dependencies.json') }}
      - name: Fetch or verify exact manifest-pinned runtime fixtures
        run: python scripts/fetch-test-dependencies.py "${{ runner.temp }}/basis-runtime-dependencies"
      - name: Verify the standalone build
        run: npm run check
      - name: Offline Chromium regressions
        run: npm run test:browser
      - name: Verified actual-library runtime smoke tests
        run: npm run test:dependencies -- --cache "${{ runner.temp }}/basis-runtime-dependencies"

  beta:
    name: Beta headers and integrations / ${{ matrix.browser }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: ubuntu-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned development-only browser harness
        run: python -m pip install playwright==1.62.0
      - name: Install browser and its system dependencies
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Restore separately cached public runtime fixtures
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/basis-runtime-dependencies
          key: basis-runtime-${{ runner.os }}-${{ hashFiles('tests/fixtures/runtime_dependencies.json') }}
      - name: Fetch or verify exact manifest-pinned runtime fixtures
        run: python scripts/fetch-test-dependencies.py "${{ runner.temp }}/basis-runtime-dependencies"
      - name: Build minimal beta candidate with matching security headers
        run: npm run build:beta
      - name: Verify deployment inventory and matching security policy
        run: npm run verify:beta
      - name: Test the served deployment candidate
        run: npm run test:beta -- --cache "${{ runner.temp }}/basis-runtime-dependencies" --browser ${{ matrix.browser }}
