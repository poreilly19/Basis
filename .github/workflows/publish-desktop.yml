name: Prepare verified desktop release assets

"on":
  workflow_dispatch:
    inputs:
      source_sha:
        description: Tested source snapshot
        type: string
        required: true
        default: 351120ae97fd6e769f015eb14c5e341e0d363ad7
      native_run_id:
        description: Successful installed-Windows validation run
        type: string
        required: true
        default: '42063543855'
      release_tag:
        description: Existing desktop beta draft
        type: string
        required: true
        default: v0.7.30-desktop-beta.1

permissions:
  contents: read
  actions: read

concurrency:
  group: prepare-desktop-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  assets:
    name: Verify and upload tested assets to draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      BASIS_SOURCE_SHA: ${{ inputs.source_sha }}
      BASIS_NATIVE_RUN: ${{ inputs.native_run_id }}
      BASIS_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Require the verified beta inputs
        run: |
          python - <<'PY'
          import os
          assert os.environ['BASIS_SOURCE_SHA']=='351120ae97fd6e769f015eb14c5e341e0d363ad7', 'Unverified source snapshot'
          assert os.environ['BASIS_NATIVE_RUN']=='42063543855', 'Unverified native build'
          assert os.environ['BASIS_RELEASE_TAG']=='v0.7.30-desktop-beta.1', 'Unexpected release draft'
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Basis-Studio-Windows-0.7.30
          run-id: ${{ inputs.native_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: native
      - name: Build and verify the matching web package
        run: npm --prefix source/Project run build:beta && npm --prefix source/Project run verify:beta
      - name: Prepare checked release assets
        run: python publisher/.github/scripts/prepare-desktop-release.py --source source --native native --output release-assets
      - name: Upload only to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$BASIS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          test "$draft" = true
          gh release upload "$BASIS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release-assets/* --clobber
          gh release view "$BASIS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '{draft:.isDraft,assets:[.assets[]|{name,size,state}]}'
